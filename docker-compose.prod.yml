version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: dxc-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_projet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-blue:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME_BACKEND:-dxc-backend}:${IMAGE_TAG:-latest}
    container_name: dxc-backend-blue
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestion_projet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-TXlDbGVTZWNyZXRNYUNsZVNlY3JldE1hQ2xlU2VjcmV0MTIzNDU=}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-test-key}
    volumes:
      - backend_prod_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  backend-green:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME_BACKEND:-dxc-backend}:${IMAGE_TAG_GREEN:-latest}
    container_name: dxc-backend-green
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestion_projet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-TXlDbGVTZWNyZXRNYUNsZVNlY3JldE1hQ2xlU2VjcmV0MTIzNDU=}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-test-key}
    volumes:
      - backend_prod_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

volumes:
  postgres_prod_data:
  backend_prod_uploads:

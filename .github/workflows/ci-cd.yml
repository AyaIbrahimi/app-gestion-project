name: Enterprise CI/CD Pipeline (Spring Boot + Angular + Docker + Security)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ayaibrahimi/dxc-backend
  FRONTEND_IMAGE: ayaibrahimi/dxc-frontend

jobs:
  # ============================================================================
  # JOB 1: Backend CI & Unit/Integration Testing
  # ============================================================================
  backend-ci:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run Unit Tests
        working-directory: ./Backend
        run: mvn clean test -Dspring.profiles.active=test -B

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend-test-results
          path: Backend/target/surefire-reports/

  # ============================================================================
  # JOB 2: Frontend CI & Build Verification
  # ============================================================================
  frontend-ci:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install NPM Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Angular Production Build
        working-directory: ./Frontend
        run: npm run build -- --configuration=production

  # ============================================================================
  # JOB 3: Security Scanning (SAST, SCA & Secret Leak Detection)
  # ============================================================================
  security-scan:
    name: Security Scans (SAST, SCA & Secret Leak)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Warm up Maven dependencies
        working-directory: ./Backend
        run: mvn -B -q dependency:resolve -Dmaven.wagon.http.retryHandler.count=5 || true

      - name: Secret Scanning (Trufflehog)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != github.sha && github.event.before != '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
        continue-on-error: true

      - name: SAST & SCA Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # JOB 4: Build & Push OCI Docker Images to GHCR
  # ============================================================================
  build-and-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # JOB 5: Deploy to Staging & Run DAST (OWASP ZAP)
  # ============================================================================
  deploy-staging:
    name: Staging Deployment & DAST Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      actions: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gestion_projet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Backend Container
        run: |
          docker run -d --name backend \
            --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/gestion_projet \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            ghcr.io/ayaibrahimi/dxc-backend:${{ github.sha }}

      - name: Wait for Backend Health Check
        run: |
          max_attempts=30
          attempt=1
          until curl -f http://localhost:8080/actuator/health || [ $attempt -eq $max_attempts ]; do
            if ! docker ps --format '{{.Names}}' | grep -q '^backend$'; then
              echo "Backend container stopped unexpectedly"
              docker logs backend
              exit 1
            fi
            echo "Waiting for backend service... (attempt $attempt/$max_attempts)"
            sleep 2
            ((attempt++))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "Backend service failed to start"
            docker logs backend
            exit 1
          fi

      - name: DAST Security Scan (OWASP ZAP Baseline)
        run: |
          touch report_json.json report_md.md report_html.html
          chmod a+w report_json.json report_md.md report_html.html
          docker run -v ${{ github.workspace }}:/zap/wrk/:rw --network host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080/actuator/health \
            -J report_json.json -w report_md.md -r report_html.html || true

      - name: Upload ZAP Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-reports
          path: |
            report_html.html
            report_md.md
            report_json.json

  # ============================================================================
  # JOB 6: Production Blue-Green Deployment with Auto-Rollback
  # ============================================================================
  deploy-production:
    name: Production Blue-Green Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Blue-Green Script on Production Server
        run: |
          chmod +x scripts/deploy-blue-green.sh scripts/rollback.sh
          ./scripts/deploy-blue-green.sh

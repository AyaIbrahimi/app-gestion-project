global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dxc-platform-monitor'

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dxc-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'dxc-platform-backend'
          environment: 'production'

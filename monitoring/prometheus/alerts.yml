groups:
  - name: dxc_platform_alerts
    rules:
      - alert: HighHttpErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m])) / sum(rate(http_server_requests_seconds_count[2m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Error Rate detected"
          description: "HTTP 5xx error rate is currently {{ $value | printf \"%.2f\" }}% over the last 2 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High P95 Latency (> 2 seconds)"
          description: "95th percentile HTTP latency is {{ $value | printf \"%.2f\" }}s."

      - alert: HighJvmMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "JVM Heap Memory Usage High"
          description: "JVM Heap memory usage is at {{ $value | printf \"%.2f\" }}%."

      - alert: DatabaseConnectionPoolExhausted
        expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP DB Connection Pool Near Exhaustion"
          description: "Active database connections are at {{ $value | printf \"%.2f\" }}% of max capacity."
